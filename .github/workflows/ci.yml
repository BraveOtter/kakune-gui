name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: corepack enable
      - shell: pwsh
        run: pnpm.cmd install --frozen-lockfile
      - shell: pwsh
        run: pnpm.cmd check
      - shell: pwsh
        run: pnpm.cmd test
      - shell: pwsh
        run: pnpm.cmd build
      - shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml
